<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
      }

      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.8);
      }

      .content {
        text-align: center;
      }
      .title {
        font-size: 60px;
        color: #fff;
        text-align: center;
        margin: 0 auto;
        max-width: 560px;
      }
      .textContent {
        margin: 10px auto 30px;
      }
      .textVariable {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 40px;
        color: #fcec1b;
        text-align: center;
        margin: 0 auto;
      }
      .nota {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 400;
        color: #fff;
        text-align: justify;
        margin: 0px auto 20px;
        width: 90%;
      }
      .button {
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px auto;
      }

      @media (max-width: 600px) {
        .container {
          padding: 10px;
        }

        .title {
          font-size: 29px;
        }
        .textVariable {
          font-size: 16px;
        }
        .nota {
          font-size: 8px;
        }
      }
    </style>
  </head>
  <body>
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background: #000"
    >
      <tr>
        <td>
          <table
            align="center"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="margin: 0 auto; width: 100%; padding: 0px"
          >
            <tr>
              <td align="center" style="padding: 0px">
                <div class="textContent">
                  <div class="textVariable">Nombre: {{name}}</div>
                  <div class="textVariable">Correo: {{email}}</div>
                  <div class="textVariable">Mensaje: {{message}}</div>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
